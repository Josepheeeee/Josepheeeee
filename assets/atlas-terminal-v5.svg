<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Atlas — Systems Engineer</title>
  <desc id="description">An animated terminal workspace showing engineering focus, build checks, Git state, and a delivery pipeline.</desc>
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.45" fill="#f0f6fc" opacity="0.025"/>
    </pattern>
    <clipPath id="window"><rect x="3" y="3" width="1194" height="394" rx="9"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 4 8; animation: flow 5s linear infinite; }
      .blink { animation: blink 1.05s steps(1,end) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .log-1 { animation: log 8s ease-in-out infinite; }
      .log-2 { animation: log 8s ease-in-out -1.3s infinite; }
      .log-3 { animation: log 8s ease-in-out -2.6s infinite; }
      .log-4 { animation: log 8s ease-in-out -3.9s infinite; }
      @keyframes flow { to { stroke-dashoffset: -96; } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes log { 0%,12% { opacity: .35; } 20%,72% { opacity: 1; } 88%,100% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .flow,.blink,.pulse,.log-1,.log-2,.log-3,.log-4 { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="10" fill="#010409"/>
  <g clip-path="url(#window)">
    <rect x="3" y="3" width="1194" height="394" fill="#0d1117"/>
    <rect x="3" y="3" width="1194" height="394" fill="url(#grain)"/>

    <rect x="3" y="3" width="1194" height="51" fill="#161b22"/>
    <line x1="3" y1="54" x2="1197" y2="54" stroke="#30363d"/>
    <circle cx="29" cy="29" r="6" fill="#f85149" opacity="0.85"/>
    <circle cx="51" cy="29" r="6" fill="#d29922" opacity="0.85"/>
    <circle cx="73" cy="29" r="6" fill="#3fb950" opacity="0.85"/>
    <text x="101" y="35" class="mono" fill="#8b949e" font-size="13">atlas@localhost — zsh — 120×40</text>
    <text x="1168" y="35" class="mono" fill="#484f58" font-size="12" text-anchor="end">tty0</text>

    <line x1="686" y1="54" x2="686" y2="356" stroke="#30363d"/>

    <g class="mono" transform="translate(36 88)">
      <text x="0" y="0" fill="#8b949e" font-size="13">atlas@local</text>
      <text x="89" y="0" fill="#c9d1d9" font-size="13">~/systems</text>
      <text x="169" y="0" fill="#d29922" font-size="13">‹main*›</text>

      <text x="0" y="46" fill="#3fb950" font-size="16">$</text>
      <text x="20" y="46" fill="#f0f6fc" font-size="16">whoami</text>
      <text x="0" y="84" fill="#f0f6fc" font-size="34" font-weight="700" letter-spacing="2">ATLAS</text>
      <text x="146" y="84" fill="#8b949e" font-size="16">systems engineer</text>

      <text x="0" y="138" fill="#3fb950" font-size="16">$</text>
      <text x="20" y="138" fill="#f0f6fc" font-size="16">cat ./focus</text>
      <text x="0" y="170" fill="#79c0ff" font-size="14">agents</text>
      <text x="76" y="170" fill="#484f58" font-size="14">/</text>
      <text x="96" y="170" fill="#a5d6ff" font-size="14">LLM post-training</text>
      <text x="251" y="170" fill="#484f58" font-size="14">/</text>
      <text x="271" y="170" fill="#d2a8ff" font-size="14">NL2SQL</text>
      <text x="341" y="170" fill="#484f58" font-size="14">/</text>
      <text x="361" y="170" fill="#7ee787" font-size="14">document AI</text>

      <text x="0" y="224" fill="#3fb950" font-size="16">$</text>
      <text x="20" y="224" fill="#f0f6fc" font-size="16">make reliable</text>
      <rect x="165" y="208" width="9" height="20" rx="1" fill="#f0f6fc" class="blink"/>
      <text x="0" y="254" fill="#3fb950" font-size="13">[ok]</text>
      <text x="42" y="254" fill="#8b949e" font-size="13">reproducible by default</text>
    </g>

    <g class="mono" transform="translate(718 84)">
      <text x="0" y="0" fill="#8b949e" font-size="12" letter-spacing="1.8">BUILD / PROFILE</text>
      <circle cx="441" cy="-4" r="4" fill="#3fb950" class="pulse"/>
      <text x="429" y="0" fill="#3fb950" font-size="11" text-anchor="end">RUNNING</text>

      <g transform="translate(0 36)" font-size="13">
        <g class="log-1"><text x="0" y="0" fill="#484f58">00:01</text><text x="58" y="0" fill="#c9d1d9">contracts.check</text><text x="441" y="0" fill="#3fb950" text-anchor="end">PASS</text></g>
        <g class="log-2"><text x="0" y="36" fill="#484f58">00:02</text><text x="58" y="36" fill="#c9d1d9">tests.run</text><text x="441" y="36" fill="#3fb950" text-anchor="end">PASS</text></g>
        <g class="log-3"><text x="0" y="72" fill="#484f58">00:03</text><text x="58" y="72" fill="#c9d1d9">eval.paired</text><text x="441" y="72" fill="#3fb950" text-anchor="end">PASS</text></g>
        <g class="log-4"><text x="0" y="108" fill="#484f58">00:04</text><text x="58" y="108" fill="#c9d1d9">trace.emit</text><text x="441" y="108" fill="#d29922" text-anchor="end">READY</text></g>
      </g>

      <g transform="translate(0 184)">
        <rect width="441" height="60" rx="5" fill="#010409" stroke="#21262d"/>
        <text x="18" y="20" fill="#484f58" font-size="10">PIPELINE</text>
        <text x="18" y="43" fill="#8b949e" font-size="12">src</text>
        <path d="M48 39H91M139 39H181M235 39H277M338 39H389" fill="none" stroke="#3fb950" stroke-opacity="0.65" class="flow"/>
        <text x="97" y="43" fill="#c9d1d9" font-size="12">build</text>
        <text x="187" y="43" fill="#c9d1d9" font-size="12">test</text>
        <text x="283" y="43" fill="#c9d1d9" font-size="12">measure</text>
        <text x="395" y="43" fill="#7ee787" font-size="12">ship</text>
      </g>

      <g transform="translate(0 274)" font-size="11">
        <text x="0" y="0" fill="#484f58">git.status</text>
        <text x="93" y="0" fill="#3fb950">clean</text>
        <text x="441" y="0" fill="#8b949e" text-anchor="end">HEAD → main</text>
      </g>
    </g>

    <rect x="3" y="356" width="1194" height="41" fill="#161b22"/>
    <rect x="3" y="356" width="112" height="41" fill="#238636"/>
    <text x="26" y="382" class="mono" fill="#ffffff" font-size="12" font-weight="700">NORMAL</text>
    <text x="137" y="382" class="mono" fill="#c9d1d9" font-size="12">main*</text>
    <text x="202" y="382" class="mono" fill="#8b949e" font-size="12">utf-8</text>
    <text x="1165" y="382" class="mono" fill="#8b949e" font-size="12" text-anchor="end">build / measure / ship</text>
  </g>
  <rect x="3.5" y="3.5" width="1193" height="393" rx="8.5" fill="none" stroke="#30363d"/>
</svg>
