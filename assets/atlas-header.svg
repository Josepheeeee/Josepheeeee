<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Atlas — AI Systems</title>
  <desc id="desc">Agent and LLM systems, reproducible machine learning, and practical engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c4b5fd" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="34" r="105" fill="#5eead4" fill-opacity="0.18" filter="url(#blur)"/>
  <circle cx="175" cy="226" r="125" fill="#818cf8" fill-opacity="0.18" filter="url(#blur)"/>
  <path d="M0 210C180 154 302 244 482 193S801 130 1200 202V250H0Z" fill="#020617" fill-opacity="0.26"/>
  <path d="M70 184C280 132 402 216 596 164S908 111 1130 159" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <g fill="#e0e7ff" fill-opacity="0.72">
    <circle cx="102" cy="56" r="2"/><circle cx="109" cy="56" r="2"/><circle cx="116" cy="56" r="2"/>
    <circle cx="1063" cy="182" r="2"/><circle cx="1070" cy="182" r="2"/><circle cx="1077" cy="182" r="2"/>
  </g>
  <g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="106" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="1">ATLAS // AI SYSTEMS</text>
    <text x="600" y="145" fill="#c7d2fe" font-size="18" letter-spacing="2">AGENT &amp; LLM  ·  REPRODUCIBLE ML  ·  PRACTICAL ENGINEERING</text>
    <text x="600" y="194" fill="#99f6e4" font-size="14" letter-spacing="1.5">MODELS WITH REAL TOOLS, DATA CONTRACTS, AND EVALUATION LOOPS</text>
  </g>
</svg>
